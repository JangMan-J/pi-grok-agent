name: Release

# Pushing a tag vX.Y.Z publishes that version to npm, then creates the
# GitHub Release with the package file attached. `npm run release` does
# the bump, commit, tag, and push.
# npm trusts this workflow file (trusted publishing): no npm token is
# stored, and npm adds a provenance record.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and attach the package file
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          # No dependency cache in a publishing job (cache poisoning).
          package-manager-cache: false
      - name: Tag matches package.json version
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, package.json $want" >&2
            exit 1
          fi
      # ubuntu-latest is linux-x64; this release ships only that leash binary.
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run build:leash
      - run: npm run check
      - run: npm test
      # Pack once, then publish and attach that same file,
      # so the release asset is byte for byte what npm has.
      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - run: npm publish "$FILE"
        env:
          FILE: ${{ steps.pack.outputs.file }}
      - name: Create the GitHub Release with the package file
        run: gh release create "$GITHUB_REF_NAME" "$FILE" --title "pi-grok-agent ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          FILE: ${{ steps.pack.outputs.file }}
          GH_TOKEN: ${{ github.token }}
